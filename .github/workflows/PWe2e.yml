name: Playwright Tests

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment to run tests"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - dev
          - stage

jobs:
  playwright-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test --reporter=json > playwright-report.json || true
        env:
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          API_KEY: ${{ secrets.API_KEY }}

      - name: Parse test results
        id: results
        if: always()
        run: |
          if [ -f playwright-report.json ]; then
            PASSED=$(jq '[.suites[].specs[]?.tests[]? | select(.results[].status == "passed")] | length' playwright-report.json 2>/dev/null || echo 0)
            FAILED=$(jq '[.suites[].specs[]?.tests[]? | select(.results[].status == "failed")] | length' playwright-report.json 2>/dev/null || echo 0)
            SKIPPED=$(jq '[.suites[].specs[]?.tests[]? | select(.results[].status == "skipped")] | length' playwright-report.json 2>/dev/null || echo 0)
            TOTAL=$((PASSED + FAILED + SKIPPED))
          else
            PASSED=0; FAILED=0; SKIPPED=0; TOTAL=0
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ job.status == 'success' && '✅' || '❌' }} Playwright Test Run",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                    { "type": "mrkdwn", "text": "*Environment:*\n${{ github.event.inputs.environment || 'qa' }}" },
                    { "type": "mrkdwn", "text": "*Status:*\n${{ job.status }}" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Total:*\n${{ steps.results.outputs.total }}" },
                    { "type": "mrkdwn", "text": "*✅ Passed:*\n${{ steps.results.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*❌ Failed:*\n${{ steps.results.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*⏭️ Skipped:*\n${{ steps.results.outputs.skipped }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true